name: macOS release candidate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag on this exact main commit; leave empty for test/build only'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: macos-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check source history and tree for secrets
        shell: bash
        run: |
          set -euo pipefail
          scan="$(mktemp -d)"
          trap 'rm -rf "$scan"' EXIT
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$scan/gitleaks.tar.gz"
          (cd "$scan" && echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum -c)
          tar -xzf "$scan/gitleaks.tar.gz" -C "$scan" gitleaks
          # Pass a clean config and ignore file explicitly, including for PRs.
          printf '[extend]\nuseDefault = true\n' > "$scan/gitleaks.toml"
          touch "$scan/empty.gitleaksignore"
          common=(--config "$scan/gitleaks.toml" --gitleaks-ignore-path "$scan/empty.gitleaksignore" --redact=100 --ignore-gitleaks-allow)
          "$scan/gitleaks" git "${common[@]}" --log-opts="$GITHUB_SHA" .
          "$scan/gitleaks" dir "${common[@]}" .
      - name: Require review before introducing external dependency managers
        shell: bash
        run: |
          set -euo pipefail
          paths=$(git ls-files -- Package.resolved Podfile Podfile.lock Cartfile Cartfile.resolved .gitmodules)
          test -z "$paths" || { echo 'Configure a macOS dependency advisory scan before adding dependencies.' >&2; exit 1; }

  test-build:
    needs: security
    outputs:
      artifact-id: ${{ steps.stage.outputs.artifact-id }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify no external SwiftPM dependencies
        shell: bash
        run: |
          set -euo pipefail
          swift package dump-package | jq -e '.dependencies == []' >/dev/null
      - name: Run macOS regression tests
        run: |
          swift test
      - name: Build release app
        run: |
          ./scripts/build-app.sh --universal
      - name: Verify app identity, architecture and release source
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          app='dist/LidClosed.app'
          plist="$app/Contents/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$plist")" = 'com.akwnnwastaken.LidClosed'
          exe=$(plutil -extract CFBundleExecutable raw -o - "$plist")
          test "$exe" = 'LidClosed'
          actual=$(lipo -archs "$app/Contents/MacOS/$exe" | tr ' ' '\n' | sort | xargs)
          test "$actual" = 'arm64 x86_64'
          if [[ -n "$TAG" ]]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF" = refs/heads/main
            [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            test "v$(plutil -extract CFBundleShortVersionString raw -o - "$plist")" = "$TAG"
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA"
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/staged-app.zip"
          jq -n --arg sha "$GITHUB_SHA" --arg xcode "$(xcodebuild -version)" \
            --arg runner "$(sw_vers -productVersion)" '{commit:$sha,xcode:$xcode,macos:$runner}' \
            > "$RUNNER_TEMP/stage-provenance.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: stage
        with:
          name: macos-staged-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/staged-app.zip
            ${{ runner.temp }}/stage-provenance.json
          if-no-files-found: error
          retention-days: 3

  sign-notarize:
    needs: test-build
    outputs:
      artifact-id: ${{ steps.final.outputs.artifact-id }}
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.tag != ''
    runs-on: macos-15
    timeout-minutes: 90
    environment: macos-production-signing
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Require security and release approval for this exact SHA
        env:
          APPROVED_SHA: ${{ vars.MACOS_RELEASE_APPROVED_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APPROVED_SHA" && test "$APPROVED_SHA" = "$GITHUB_SHA" || {
            echo 'Missing protected approval for this exact commit; review the audit and CI evidence first.' >&2
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.test-build.outputs.artifact-id }}
          path: ${{ runner.temp }}/staging
      - name: Stage app and recheck the expected architecture
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg sha "$GITHUB_SHA" '.commit == $sha' "$RUNNER_TEMP/staging/stage-provenance.json" >/dev/null
          ditto -x -k "$RUNNER_TEMP/staging/staged-app.zip" "$RUNNER_TEMP/staging"
          actual=$(lipo -archs "$RUNNER_TEMP/staging/LidClosed.app/Contents/MacOS/LidClosed" | tr ' ' '\n' | sort | xargs)
          test "$actual" = 'arm64 x86_64'
      - name: Developer ID sign, notarize, staple and verify
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          APPLE_INSTALLER_IDENTITY: ${{ vars.APPLE_INSTALLER_IDENTITY }}
          APPLE_INSTALLER_P12_BASE64: ${{ secrets.APPLE_INSTALLER_P12_BASE64 }}
          APPLE_INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_INSTALLER_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir "$RUNNER_TEMP/final"
          bash scripts/sign-and-notarize.sh "$RUNNER_TEMP/staging/LidClosed.app" 'com.akwnnwastaken.LidClosed' "$TAG" \
            "$RUNNER_TEMP/final/LidClosed-$VERSION.pkg" scripts/package-release.sh
      - name: Record provenance
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" --arg tag "$TAG" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" --slurpfile build "$RUNNER_TEMP/staging/stage-provenance.json" \
            '{repository:$repo,commit:$sha,tag:$tag,run:$run,sign_run_attempt:$attempt,build:$build[0]}' \
            > "$RUNNER_TEMP/final/build-provenance.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: final
        with:
          name: macos-notarized-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final/*
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: sign-notarize
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sign-notarize.outputs.artifact-id }}
          path: release
      - name: Verify checksum and source provenance
        id: verified
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          VERSION="${TAG#v}"
          asset="LidClosed-$VERSION.pkg"
          test "$(cat "$asset.sha256")" = "$(sha256sum "$asset")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" --arg tag "$TAG" \
            '.repository == $repo and .commit == $sha and .tag == $tag' build-provenance.json >/dev/null
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - name: Create a new draft only
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASSET: ${{ steps.verified.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          # Re-resolve the remote tag at the last trusted decision point.
          ref=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG")
          type=$(jq -er '.object.type' <<< "$ref")
          target=$(jq -er '.object.sha' <<< "$ref")
          if [[ "$type" == tag ]]; then
            ref=$(gh api "repos/$GH_REPO/git/tags/$target")
            type=$(jq -er '.object.type' <<< "$ref")
            target=$(jq -er '.object.sha' <<< "$ref")
          else
            test "$type" = commit
          fi
          test "$type" = commit
          test "$target" = "$GITHUB_SHA"
          releases=$(gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100")
          jq -e --arg tag "$TAG" 'all(.[][]; .tag_name != $tag)' <<< "$releases" >/dev/null || {
            echo 'A release already exists for this tag; no assets were changed.' >&2
            exit 1
          }
          echo 'Install the signed PKG from this release to install the app and both sleep recovery services.' > draft-notes.md
          gh release create "$TAG" "$ASSET" "$ASSET.sha256" build-provenance.json \
            --verify-tag --draft --title "LidClosed $TAG" --generate-notes --notes-file draft-notes.md
          # The API exposes each stored asset digest; check GitHub received the expected bytes.
          remote=$(gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" |
            jq -ce --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)] | select(length == 1) | .[0] | select(.draft)')
          for file in "$ASSET" "$ASSET.sha256" build-provenance.json; do
            digest="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            jq -e --arg file "$file" --arg digest "$digest" \
              'any(.assets[]; .name == $file and .digest == $digest)' <<< "$remote" >/dev/null
          done
