name: Test and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test on macOS
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: swift test

  release:
    name: Publish version change
    if: github.event_name == 'push'
    needs: test
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish release for a new version
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          plist=Resources/Info.plist
          version=$(plutil -extract CFBundleShortVersionString raw -o - "$plist")
          previous=$(git show "$BEFORE:$plist" | plutil -extract CFBundleShortVersionString raw -o - -- -)
          if [[ "$version" == "$previous" ]]; then
            echo "Version unchanged ($version)."
            exit 0
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi

          tag="v$version"
          if existing=$(git rev-parse --quiet --verify "refs/tags/$tag^{commit}"); then
            if [[ "$existing" != "$GITHUB_SHA" ]]; then
              echo "$tag already points to $existing." >&2
              exit 1
            fi
            if draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
              if [[ "$draft" == true ]]; then
                echo "$tag already has a draft release. Publish it from GitHub." >&2
                exit 1
              fi
              echo "$tag is already published."
              exit 0
            fi
          fi

          gh release create "$tag" --target "$GITHUB_SHA" --title "LidClosed $version" --generate-notes
